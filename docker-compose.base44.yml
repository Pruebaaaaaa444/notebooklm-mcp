# Base44 development compose for notebooklm-mcp
# Runs the MCP server in Streamable-HTTP mode on port 3000.
# Source is bind-mounted so edits hot-reload via tsx watch.
services:
  mcp:
    image: node:22
    working_dir: /app
    # Bind-mount the cloned source so edits are reflected live.
    volumes:
      - ./:/app
      - mcp_data:/root/.local/share/notebooklm-mcp
    ports:
      - "3000:3000"
    environment:
      # Streamable-HTTP transport on 0.0.0.0 so the preview proxy can reach it.
      - NOTEBOOKLM_TRANSPORT=http
      - NOTEBOOKLM_PORT=3000
      - NOTEBOOKLM_HOST=0.0.0.0
    command: ["sh", "-ec", "npm install && exec npx tsx watch src/index.ts --transport http --port 3000 --host 0.0.0.0"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)throw new Error('bad')}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: on-failure

volumes:
  mcp_data:
