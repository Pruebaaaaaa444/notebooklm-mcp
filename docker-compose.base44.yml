services:
  mcp:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - NOTEBOOKLM_TRANSPORT=http
      - NOTEBOOKLM_PORT=3000
      - NOTEBOOKLM_HOST=0.0.0.0
      - HEADLESS=true
    command: ["sh", "-ec", "CI=true npm ci && exec npx tsx watch src/index.ts"]
    ports:
      - "3000:3000"
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
